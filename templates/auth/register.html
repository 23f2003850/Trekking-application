{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm mt-5">
            <div class="card-header bg-dark text-white text-center">
                <h4>Register for TrekApp</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-3">
                        <label for="role" class="form-label">I want to register as a:</label>
                        <select class="form-select" id="role" name="role" required>
                            <option value="trekker">User (Trekker)</option>
                            <option value="staff">Trek Staff</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label for="contact" class="form-label">Contact Details (Required for Staff)</label>
                        <input type="text" class="form-control" id="contact" name="contact" placeholder="Phone number or address">
                    </div>
                    <button type="submit" class="btn btn-success w-100">Register Account</button>
                </form>
                <div class="text-center mt-3">
                    <p>Already have an account? <a href="{{ url_for('login') }}">Log in here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
