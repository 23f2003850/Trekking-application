{% extends 'base.html' %}
{% block content %}
<h2>Edit Trek: {{ trek.name }} (ID: {{ trek.id }})</h2><hr>
<form method="POST" action="{{ url_for('edit_trek', trek_id=trek.id) }}" class="mt-4">
    <div class="row">
        <div class="col-md-6 mb-3">
            <label>Trek Name</label>
            <input type="text" class="form-control" name="name" value="{{ trek.name }}" required>
        </div>
        <div class="col-md-6 mb-3">
            <label>Location</label>
            <input type="text" class="form-control" name="location" value="{{ trek.location }}" required>
        </div>
    </div>
    <div class="row">
        <div class="col-md-4 mb-3">
            <label>Difficulty</label>
            <select class="form-select" name="difficulty">
                <option value="Easy" {% if trek.difficulty == 'Easy' %}selected{% endif %}>Easy</option>
                <option value="Moderate" {% if trek.difficulty == 'Moderate' %}selected{% endif %}>Moderate</option>
                <option value="Hard" {% if trek.difficulty == 'Hard' %}selected{% endif %}>Hard</option>
            </select>
        </div>
        <div class="col-md-4 mb-3">
            <label>Duration (Days)</label>
            <input type="number" class="form-control" name="duration" value="{{ trek.duration }}" required>
        </div>
        <div class="col-md-4 mb-3">
            <label>Total Slots</label>
            <input type="number" class="form-control" name="slots" value="{{ trek.total_slots }}" required>
            <small class="text-muted">Currently Available: {{ trek.available_slots }}</small>
        </div>
    </div>
    <div class="row">
        <div class="col-md-4 mb-3">
            <label>Start Date</label>
            <input type="date" class="form-control" name="start_date" value="{{ trek.start_date.strftime('%Y-%m-%d') }}" required>
        </div>
        <div class="col-md-4 mb-3">
            <label>End Date</label>
            <input type="date" class="form-control" name="end_date" value="{{ trek.end_date.strftime('%Y-%m-%d') }}" required>
        </div>
        <div class="col-md-4 mb-3">
            <label>Assign Staff (Optional)</label>
            <select class="form-select" name="staff_id">
                <option value="">-- No Guide Assigned --</option>
                {% for staff in staff_members %}
                    <option value="{{ staff.id }}" {% if trek.guide and trek.guide.user_id == staff.id %}selected{% endif %}>{{ staff.name }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="{{ url_for('admin_manage_treks') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
